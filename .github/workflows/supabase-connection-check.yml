name: Check Supabase database connection

on:
  workflow_dispatch:
  push:
    branches:
      - work/blueprint-phase-03
    paths:
      - '.github/workflows/supabase-connection-check.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-connection-check.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'

permissions:
  contents: read

jobs:
  check-connection:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets are configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "Missing DATABASE_URL or DIRECT_URL repository Actions secret."
            exit 1
          fi
          echo "Both required secrets are present; values will not be printed."

      - name: Inspect migration files for this branch
        id: migrations
        shell: bash
        run: |
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit: $(git rev-parse --short HEAD)"
          if [ -d prisma/migrations ]; then
            find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print
          else
            echo "No prisma/migrations directory exists on this branch."
          fi
          if ! find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print -quit 2>/dev/null | grep -q .; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Prisma migration-status check: this branch contains no migration.sql files. This is not a database health check."
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check database connection and migration status (read-only)
        if: steps.migrations.outputs.has_migrations == 'true'
        run: npx --yes prisma@6 migrate status --schema prisma/schema.prisma
